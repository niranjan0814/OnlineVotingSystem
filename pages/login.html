<script>
    document.addEventListener("DOMContentLoaded", function() {
      const signinForm = document.getElementById('signin-form');
      const signupForm = document.getElementById('signup-form');

      if (signinForm) {
        signinForm.addEventListener('submit', function(event) {
          const usernameInput = document.getElementById('username1');
          const passwordInput = document.getElementById('password1');
          const usernameValue = usernameInput.value.trim();
          const passwordValue = passwordInput.value.trim();

          if (!usernameValue || !passwordValue) {
            event.preventDefault();
            if (!usernameValue) {
              alert("Please enter a username.");
            }
            if (!passwordValue) {
              alert("Please enter a password.");
            }
          } else {
            alert('Signin form submitted with username: ' + usernameValue + ' and password: ' + passwordValue);
          }
        });
      }

      if (signupForm) {
        signupForm.addEventListener('submit', function(event) {
          const usernameInput = document.getElementById('username2');
          const passwordInput = document.getElementById('password2');
          const confirmPasswordInput = document.getElementById('confirmpassword');
          const emailInput = document.getElementById('email');
          const phoneNumberInput = document.getElementById('phonenumber');
          const dobInput = document.getElementById('dob');

          const usernameValue = usernameInput.value.trim();
          const passwordValue = passwordInput.value.trim();
          const confirmPasswordValue = confirmPasswordInput.value.trim();
          const emailValue = emailInput.value.trim();
          const phoneNumberValue = phoneNumberInput.value.trim();
          const dobValue = dobInput.value.trim();

          if (!usernameValue || !passwordValue || !confirmPasswordValue || !emailValue || !phoneNumberValue || !dobValue) {
            event.preventDefault();
            alert("Please fill in all fields.");
          } else {
            alert('Signup form submitted with username: ' + usernameValue);
          }
        });
      }
    });
</script>
